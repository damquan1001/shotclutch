name: Windows ARM64 compile (unqualified)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup target add aarch64-pc-windows-msvc
      - run: cargo check --locked -p filmcraft -p filmcraft-cli --target aarch64-pc-windows-msvc
