name: Packaging lint
on:
  push:
    branches: [main, codex/m0-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse all PowerShell packaging and qualification scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem packaging/windows,scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Write-Error; $failed = $true }
          }
          if ($failed) { exit 1 }
          python -m compileall -q scripts/ci scripts/m0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/ci -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate installer identity and legal references
        shell: pwsh
        run: |
          [xml]$wix = Get-Content packaging/windows/shotclutch.wxs
          if ($wix.Wix.Package.Name -ne 'ShotClutch') { throw 'Wrong product identity' }
          if ($wix.Wix.Package.UpgradeCode -eq '31E6FB14-9DBC-41DD-B24B-26B71FB31B62') { throw 'Upstream installer identity reused' }
  unix-and-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned workflow linter and packaging validators
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils appstream
      - name: Workflow and shell checks
        run: |
          "$(go env GOPATH)/bin/actionlint"
          find packaging -name '*.sh' -print0 | xargs -0 shellcheck -x -P SCRIPTDIR
          find packaging -name '*.sh' -print0 | xargs -0 -n1 bash -n
          desktop-file-validate packaging/linux/com.shotclutch.editor.desktop
          sed -e 's/@VERSION@/0.13.0/g' -e 's/@DATE@/2026-10-26/g' packaging/linux/com.shotclutch.editor.metainfo.xml.in > /tmp/shotclutch.metainfo.xml
          appstreamcli validate --no-net /tmp/shotclutch.metainfo.xml
  required:
    if: always()
    needs: [scripts, unix-and-workflows]
    runs-on: ubuntu-24.04
    steps:
      - name: All packaging prerequisites passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(job["result"]=="success" for job in results.values()), results'
