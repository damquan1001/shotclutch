name: FreeBSD core compile (unqualified)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup target add x86_64-unknown-freebsd
      - run: cargo check --locked -p filmcraft-engine --target x86_64-unknown-freebsd
