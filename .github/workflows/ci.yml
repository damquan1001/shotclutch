name: CI
on:
  push:
    branches: [codex/m3-semantic-media]
    paths: [.github/workflows/ci.yml]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      vault_platform:
        description: "Run the full workflow or only the macOS vault qualification"
        type: choice
        default: all
        options: [all, macos-15]
permissions:
  contents: read
concurrency:
  group: m1-ci-${{ github.event.pull_request.number || github.ref }}${{ (github.event_name == 'push' || inputs.vault_platform == 'macos-15') && '-macos-vault' || '' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  required:
    name: CI required
    if: github.event_name != 'push' && inputs.vault_platform != 'macos-15' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: m1-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: M1 headless correctness suite
        run: python scripts/ci/m1-checks.py
      - name: M2 Smart Cut correctness suite
        run: python scripts/ci/m2-checks.py
      - name: M3 semantic media and edit policy correctness suite
        run: "cargo test --locked -p shotclutch-engine --lib -- media_observations:: media_search:: media_inspection:: edit_verification_tests:: agent_policy_tests:: service::runs::tests:: credentials::tests:: privacy::tests:: review_provider::tests::"
      - name: SEC-004 local provider fixtures
        run: "cargo test --locked -p shotclutch-speech --features download --lib assemblyai::"
  credential-vaults:
    name: SEC-004 native vault (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || inputs.vault_platform == 'macos-15') && '["macos-15"]' || '["ubuntu-24.04", "windows-2025", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        name: Qualify isolated Linux Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-daemon gnome-keyring
          dbus-run-session -- bash -euc '
            export XDG_DATA_HOME="$(mktemp -d)"
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            printf %s disposable-vault-test | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p shotclutch-engine --lib credentials::tests::native_vault_round_trip -- --ignored --exact
          '
          DBUS_SESSION_BUS_ADDRESS=unix:path="$RUNNER_TEMP/absent-secret-service" \
            cargo test --locked -p shotclutch-engine --lib credentials::tests::native_vault_reports_unavailable -- --ignored --exact
      - if: runner.os == 'macOS'
        name: Build macOS Keychain fixture
        timeout-minutes: 30
        run: cargo test --locked -p shotclutch-engine --lib credentials::tests::native_vault_round_trip --no-run
      - if: runner.os == 'macOS'
        name: Qualify isolated macOS Keychain
        timeout-minutes: 4
        run: |
          keychain="$RUNNER_TEMP/shotclutch-tests.keychain-db"
          password=disposable-vault-test
          trap 'security delete-keychain "$keychain"' EXIT
          security create-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security set-keychain-settings -lut 600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "Isolated Keychain is ready"
          SHOTCLUTCH_TEST_KEYCHAIN="$keychain" SHOTCLUTCH_TEST_KEYCHAIN_PASSWORD="$password" \
            cargo test --locked -p shotclutch-engine --lib credentials::tests::native_vault_round_trip -- --ignored --exact --nocapture
      - if: runner.os == 'Windows'
        name: Qualify Windows Credential Manager
        run: cargo test --locked -p shotclutch-engine --lib credentials::tests::native_vault_round_trip -- --ignored --exact
      - if: runner.os == 'Windows'
        name: Verify Privacy and Data desktop menu
        run: "cargo test --locked -p shotclutch-ui-egui --lib privacy_panel::tests::"
