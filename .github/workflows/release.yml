name: Windows qualification package
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: dotnet tool install wix --tool-path target/m0/tools --version 5.0.2
      - name: Build unsigned qualification packages
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Validate portable package
        shell: pwsh
        run: ./scripts/m0/validate-package.ps1 -Dist dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shotclutch-windows-x64
          path: dist/release/*
          if-no-files-found: error
  install:
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shotclutch-windows-x64
          path: dist/release
      - name: Install, inspect, and uninstall in disposable runner
        shell: pwsh
        run: ./scripts/m0/install-check.ps1 -Dist dist/release -Arch x64
