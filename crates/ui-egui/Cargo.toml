[package]
name = "shotclutch-ui-egui"
description = "The ShotClutch egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shotclutch-format = { workspace = true }
shotclutch-env = { workspace = true }
craft-ui = { workspace = true }
shotclutch-time = { workspace = true }
shotclutch-geom = { workspace = true }
shotclutch-color = { workspace = true }
shotclutch-frame = { workspace = true }
shotclutch-media = { workspace = true }
shotclutch-project = { workspace = true }
shotclutch-tts = { workspace = true }
shotclutch-edit = { workspace = true }
shotclutch-render = { workspace = true }
shotclutch-text = { workspace = true }
shotclutch-audio-dsp = { workspace = true }
shotclutch-engine = { workspace = true }
shotclutch-export = { workspace = true }
shotclutch-gpu = { workspace = true }
shotclutch-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# ShotClutch wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
shotclutch-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
shotclutch-platform = { workspace = true }
shotclutch-interchange = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = "3"

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
shotclutch-env = { workspace = true }
serde_json = { workspace = true }
toml = "1"
