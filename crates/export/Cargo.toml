[package]
name = "shotclutch-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shotclutch-env = { workspace = true }
shotclutch-time = { workspace = true }
shotclutch-frame = { workspace = true }
shotclutch-color = { workspace = true }
shotclutch-media = { workspace = true }
shotclutch-project = { workspace = true }
shotclutch-render = { workspace = true }
shotclutch-audio-dsp = { workspace = true }
shotclutch-geom = { workspace = true }
shotclutch-text = { workspace = true }
shotclutch-isobmff = { workspace = true }
shotclutch-prores = { workspace = true }
shotclutch-dnx = { workspace = true }
shotclutch-apv = { workspace = true }
shotclutch-mxf = { workspace = true }
shotclutch-aac = { workspace = true }
shotclutch-flac = { workspace = true }
shotclutch-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
shotclutch-testkit = { workspace = true }
shotclutch-codecs = { workspace = true }
