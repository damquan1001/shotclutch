[package]
name = "shotclutch-engine"
description = "ShotClutch engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["shotclutch-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["shotclutch-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["shotclutch-tts/kokoro", "speech-download"]

[dependencies]
sha2 = { workspace = true }
shotclutch-env = { workspace = true }
shotclutch-time = { workspace = true }
shotclutch-geom = { workspace = true }
shotclutch-color = { workspace = true }
shotclutch-frame = { workspace = true }
shotclutch-media = { workspace = true }
shotclutch-codecs = { workspace = true }
shotclutch-project = { workspace = true }
shotclutch-edit = { workspace = true }
shotclutch-render = { workspace = true }
shotclutch-scopes = { workspace = true }
shotclutch-text = { workspace = true }
shotclutch-audio-dsp = { workspace = true }
shotclutch-export = { workspace = true }
shotclutch-mxf = { workspace = true }
shotclutch-format = { workspace = true }
shotclutch-interchange = { workspace = true }
shotclutch-captions = { workspace = true }
shotclutch-speech = { workspace = true }
shotclutch-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
tempfile = "3.27"
shotclutch-testkit = { workspace = true }
shotclutch-dng = { workspace = true, features = ["writer"] }
shotclutch-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "=4.0.3"
tempfile = "3.27"
