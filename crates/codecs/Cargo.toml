[package]
name = "shotclutch-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
shotclutch-time = { workspace = true }
shotclutch-color = { workspace = true }
shotclutch-frame = { workspace = true }
shotclutch-media = { workspace = true }
shotclutch-avi = { workspace = true }
shotclutch-isobmff = { workspace = true }
shotclutch-matroska = { workspace = true }
shotclutch-mxf = { workspace = true }
shotclutch-mpegts = { workspace = true }
shotclutch-mpeg2v = { workspace = true }
shotclutch-ac3 = { workspace = true }
shotclutch-mpa = { workspace = true }
shotclutch-ogg = { workspace = true }
shotclutch-bitstream = { workspace = true }
shotclutch-h264 = { workspace = true }
shotclutch-hevc = { workspace = true }
shotclutch-vp8 = { workspace = true }
shotclutch-vp9 = { workspace = true }
shotclutch-prores = { workspace = true }
shotclutch-dnx = { workspace = true }
shotclutch-av1 = { workspace = true }
shotclutch-apv = { workspace = true }
shotclutch-aac = { workspace = true }
shotclutch-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
shotclutch-testkit = { workspace = true }
serde_json = { workspace = true }
