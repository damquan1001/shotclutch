[package]
name = "shotclutch-cli"
description = "ShotClutch headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "shotclutch-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["shotclutch-engine/whisper", "shotclutch-engine/speech-download"]

[dependencies]
shotclutch-engine = { workspace = true }
shotclutch-export = { workspace = true }
shotclutch-project = { workspace = true }
shotclutch-render = { workspace = true }
shotclutch-time = { workspace = true }
shotclutch-gpu = { workspace = true }
shotclutch-media = { workspace = true }
shotclutch-codecs = { workspace = true }
shotclutch-platform = { workspace = true }
shotclutch-mxf = { workspace = true }
shotclutch-mpegts = { workspace = true }
shotclutch-ogg = { workspace = true }
shotclutch-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
shotclutch-testkit = { workspace = true }
