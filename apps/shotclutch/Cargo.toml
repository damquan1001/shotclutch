[package]
name = "shotclutch"
description = "ShotClutch desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "shotclutch"
build = "build.rs"

[[bin]]
name = "shotclutch"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["shotclutch-engine/whisper", "shotclutch-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["shotclutch-engine/neural-voices"]

[dependencies]
shotclutch-format = { workspace = true }
shotclutch-env = { workspace = true }
shotclutch-engine = { workspace = true }
shotclutch-export = { workspace = true }
shotclutch-project = { workspace = true }
shotclutch-render = { workspace = true }
shotclutch-time = { workspace = true }
shotclutch-gpu = { workspace = true }
shotclutch-ui-egui = { workspace = true }
shotclutch-platform = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
# Constant-time comparison of control-channel credentials.
subtle = "2.6"
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.16"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { workspace = true, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Discord links in the system browser (MIT; as PhotoCraft).
open = "5"

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"

# Icon + VERSIONINFO for shotclutch.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[build-dependencies]
shotclutch-env = { workspace = true }
