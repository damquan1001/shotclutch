[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/damquan1001/shotclutch"

[workspace.dependencies]
shotclutch-env = { path = "crates/env" }
# internal
shotclutch-time = { path = "crates/time" }
shotclutch-geom = { path = "crates/geom" }
shotclutch-color = { path = "crates/color" }
shotclutch-bitstream = { path = "crates/bitstream" }
shotclutch-isobmff = { path = "crates/isobmff" }
shotclutch-avi = { path = "crates/avi" }
shotclutch-matroska = { path = "crates/matroska" }
shotclutch-mxf = { path = "crates/mxf" }
shotclutch-cfb = { path = "crates/cfb" }
shotclutch-mpegts = { path = "crates/mpegts" }
shotclutch-mpeg2v = { path = "crates/mpeg2v" }
shotclutch-ac3 = { path = "crates/ac3" }
shotclutch-mpa = { path = "crates/mpa" }
shotclutch-ogg = { path = "crates/ogg" }
shotclutch-h264 = { path = "crates/h264" }
shotclutch-hevc = { path = "crates/hevc" }
shotclutch-vp8 = { path = "crates/vp8" }
shotclutch-vp9 = { path = "crates/vp9" }
shotclutch-prores = { path = "crates/prores" }
shotclutch-dnx = { path = "crates/dnx" }
shotclutch-apv = { path = "crates/apv" }
shotclutch-dng = { path = "crates/dng" }
shotclutch-av1 = { path = "crates/av1" }
shotclutch-aac = { path = "crates/aac" }
shotclutch-flac = { path = "crates/flac" }
shotclutch-opus = { path = "crates/opus" }
shotclutch-h264enc = { path = "crates/h264enc" }
shotclutch-audio-dsp = { path = "crates/audio-dsp" }
shotclutch-frame = { path = "crates/frame" }
shotclutch-media = { path = "crates/media" }
shotclutch-codecs = { path = "crates/codecs" }
shotclutch-project = { path = "crates/project" }
shotclutch-edit = { path = "crates/edit" }
shotclutch-interchange = { path = "crates/interchange" }
shotclutch-text = { path = "crates/text" }
shotclutch-captions = { path = "crates/captions" }
shotclutch-speech = { path = "crates/speech" }
shotclutch-tts = { path = "crates/tts" }
shotclutch-tts-text = { path = "crates/tts-text" }
shotclutch-render = { path = "crates/render" }
shotclutch-gpu = { path = "crates/gpu" }
shotclutch-scopes = { path = "crates/scopes" }
shotclutch-export = { path = "crates/export" }
shotclutch-format = { path = "crates/format" }
shotclutch-engine = { path = "crates/engine" }
shotclutch-ui-egui = { path = "crates/ui-egui" }
shotclutch-automation = { path = "crates/automation" }
shotclutch-platform = { path = "crates/platform" }
shotclutch-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "f0ad6c1e1d297908915f4be315b0fcfc9be7b5d4", default-features = false }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.shotclutch-h264]
opt-level = 3

[profile.dev.package.shotclutch-h264enc]
opt-level = 3

[profile.dev.package.shotclutch-hevc]
opt-level = 3

[profile.dev.package.shotclutch-prores]
opt-level = 3

[profile.dev.package.shotclutch-dnx]
opt-level = 3

[profile.dev.package.shotclutch-apv]
opt-level = 3

[profile.dev.package.shotclutch-dng]
opt-level = 3

[profile.dev.package.shotclutch-av1]
opt-level = 3

[profile.dev.package.shotclutch-aac]
opt-level = 3

[profile.dev.package.shotclutch-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.shotclutch-audio-dsp]
opt-level = 3

[profile.dev.package.shotclutch-mxf]
opt-level = 3

[profile.dev.package.shotclutch-opus]
opt-level = 3

[profile.dev.package.shotclutch-vp8]
opt-level = 3

[profile.dev.package.shotclutch-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
